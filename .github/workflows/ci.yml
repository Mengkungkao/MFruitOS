# Repository checks without hardware (docs/quality/TESTING.md).
# Device validation is a separate, recorded process (docs/quality/VALIDATION.md).
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks and full suite (Python 3.12, real daemon)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: System Python modules used by the launcher and the real daemon
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends python3-pil python3-numpy python3-dbus python3-gi python3-cryptography
      # The real-host contract tests run the daemon bundled in drivers/whisplay.
      - name: scripts/check.sh
        env:
          PYTHON: /usr/bin/python3
        run: bash scripts/check.sh

  python39:
    name: Python 3.9 compatibility (no daemon)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: python -m pip install --quiet "Pillow>=9,<12" "cryptography>=3.4"
      - name: Unit and integration suite (WHISPLAY_SRC=/nonexistent skips the real-daemon tests)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          WHISPLAY_SRC: /nonexistent
        run: python -m unittest discover -s tests
      - name: Offscreen self-test
        run: python -m mfruitos --self-test
